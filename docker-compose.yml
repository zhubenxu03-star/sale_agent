services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sales_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sales_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - sales_agent_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sales_agent
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      APP_ENV: ${APP_ENV:-development}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-test}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: 1536
      LLM_PROVIDER: ${LLM_PROVIDER:-test}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sales_agent
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      KNOWLEDGE_STORAGE_PATH: /app/data/knowledge
      KNOWLEDGE_MAX_FILE_SIZE_MB: 20
      KNOWLEDGE_ALLOWED_EXTENSIONS: pdf,docx,txt,md,xlsx,csv
      CHUNK_TARGET_SIZE: 600
      CHUNK_OVERLAP: 100
      CHUNK_MIN_SIZE: 80
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-test}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: 1536
      EMBEDDING_BATCH_SIZE: 32
      EMBEDDING_TIMEOUT_SECONDS: 30
      LLM_PROVIDER: ${LLM_PROVIDER:-test}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1500}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_STREAM_ENABLED: ${LLM_STREAM_ENABLED:-true}
      AGENT_HISTORY_MESSAGE_LIMIT: ${AGENT_HISTORY_MESSAGE_LIMIT:-12}
      AGENT_RETRIEVAL_TOP_K: ${AGENT_RETRIEVAL_TOP_K:-6}
      AGENT_RETRIEVAL_MIN_SCORE: ${AGENT_RETRIEVAL_MIN_SCORE:-0.35}
      AGENT_MAX_KNOWLEDGE_CHARS: ${AGENT_MAX_KNOWLEDGE_CHARS:-12000}
      AGENT_MAX_CUSTOM_INSTRUCTION_CHARS: ${AGENT_MAX_CUSTOM_INSTRUCTION_CHARS:-4000}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-90}
      AGENT_MAX_CONCURRENT_REQUESTS_PER_USER: ${AGENT_MAX_CONCURRENT_REQUESTS_PER_USER:-2}
      CHAMPION_STORAGE_PATH: /app/data/champion
      CHAMPION_MAX_FILE_SIZE_MB: ${CHAMPION_MAX_FILE_SIZE_MB:-20}
      CHAMPION_ALLOWED_EXTENSIONS: ${CHAMPION_ALLOWED_EXTENSIONS:-txt,md,csv,xlsx,json,docx}
      CHAMPION_SESSION_GAP_MINUTES: ${CHAMPION_SESSION_GAP_MINUTES:-1440}
      CHAMPION_MAX_MESSAGES_PER_CONVERSATION: ${CHAMPION_MAX_MESSAGES_PER_CONVERSATION:-300}
      CHAMPION_MAX_CONVERSATIONS_PER_SOURCE: ${CHAMPION_MAX_CONVERSATIONS_PER_SOURCE:-10000}
      CHAMPION_EXTRACTOR_PROVIDER: ${CHAMPION_EXTRACTOR_PROVIDER:-test}
      CHAMPION_EXTRACTION_MODEL: ${CHAMPION_EXTRACTION_MODEL:-}
      CHAMPION_EXTRACTION_TIMEOUT_SECONDS: ${CHAMPION_EXTRACTION_TIMEOUT_SECONDS:-90}
      CHAMPION_EXTRACTION_MAX_RETRIES: ${CHAMPION_EXTRACTION_MAX_RETRIES:-2}
      CHAMPION_MAX_INPUT_CHARS: ${CHAMPION_MAX_INPUT_CHARS:-20000}
      CHAMPION_MAX_CARDS_PER_CONVERSATION: ${CHAMPION_MAX_CARDS_PER_CONVERSATION:-20}
      CHAMPION_DUPLICATE_SCORE: ${CHAMPION_DUPLICATE_SCORE:-0.92}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - sales_agent_knowledge_data:/app/data/knowledge
      - sales_agent_champion_data:/app/data/champion
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sales_agent
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      APP_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      KNOWLEDGE_STORAGE_PATH: /app/data/knowledge
      KNOWLEDGE_MAX_FILE_SIZE_MB: 20
      KNOWLEDGE_ALLOWED_EXTENSIONS: pdf,docx,txt,md,xlsx,csv
      CHUNK_TARGET_SIZE: 600
      CHUNK_OVERLAP: 100
      CHUNK_MIN_SIZE: 80
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-test}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: 1536
      EMBEDDING_BATCH_SIZE: 32
      EMBEDDING_TIMEOUT_SECONDS: 30
      LLM_PROVIDER: ${LLM_PROVIDER:-test}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CHAMPION_STORAGE_PATH: /app/data/champion
      CHAMPION_EXTRACTOR_PROVIDER: ${CHAMPION_EXTRACTOR_PROVIDER:-test}
      CHAMPION_EXTRACTION_MODEL: ${CHAMPION_EXTRACTION_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - sales_agent_knowledge_data:/app/data/knowledge
      - sales_agent_champion_data:/app/data/champion
    restart: unless-stopped

volumes:
  sales_agent_postgres_data:
  sales_agent_redis_data:
  sales_agent_knowledge_data:
  sales_agent_champion_data:
